[pytest]
# Directorio donde pytest busca los casos de prueba.
testpaths = tests

# Permite importar los paquetes pages/ y utils/ desde cualquier carpeta de tests.
pythonpath = .

python_files = test_*.py
python_functions = test_*

# Opciones aplicadas en cada ejecución: salida detallada y reporte HTML autocontenido
# (las capturas de pantalla quedan embebidas dentro del propio archivo).
addopts =
    -v
    --strict-markers
    --html=reports/reporte.html
    --self-contained-html

# --- Logging ---
# Archivo con el detalle completo de la ejecución (nivel DEBUG), útil para depurar.
log_file = reports/ejecucion.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
# Nivel de los logs que pytest captura por test y que aparecen en el reporte HTML.
log_level = INFO
log_format = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_date_format = %H:%M:%S

# Marcadores disponibles para filtrar la suite con -m
markers =
    ui: pruebas de interfaz con Selenium WebDriver
    api: pruebas de API con Requests
    smoke: casos críticos que validan el funcionamiento básico
    login: casos relacionados con la autenticación
    inventario: casos relacionados con el catálogo de productos
    carrito: casos relacionados con el carrito de compras
    checkout: casos relacionados con el proceso de compra
    negativo: escenarios donde el sistema debe rechazar la acción
    e2e: flujos completos de punta a punta
    encadenado: pruebas de API donde una petición depende de otra
