[pytest]
# Directorio donde pytest busca los casos de prueba.
testpaths = tests

# Permite importar helpers.py desde cualquier carpeta de tests.
pythonpath = .

# Convenciones de nombres que pytest reconoce como tests.
python_files = test_*.py
python_functions = test_*

# Opciones aplicadas en cada ejecución: salida detallada y reporte HTML.
addopts =
    -v
    --strict-markers
    --html=reports/reporte.html
    --self-contained-html

# Marcadores disponibles para filtrar la suite con -m
markers =
    smoke: casos críticos que validan las consignas obligatorias
    login: casos relacionados con la autenticación
    catalogo: casos relacionados con la página de inventario
    carrito: casos relacionados con el carrito de compras
    negativo: escenarios donde el sistema debe rechazar la acción
    edge: casos borde y condiciones límite
    e2e: flujos completos de punta a punta
